<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" height="36">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF" />
      <stop offset="100%" stop-color="#4B2FFF" />
    </linearGradient>
  </defs>
  <!-- Orbit and Planet -->
  <circle cx="20" cy="20" r="14" fill="none" stroke="url(#logoGrad)" stroke-width="3" />
  <circle cx="20" cy="20" r="6" fill="#7C5CFF" />
  <path d="M 4 20 A 16 6 0 0 0 36 20" fill="none" stroke="#E6ECFF" stroke-width="1.5" />
  
  <!-- "BOOMI" Text styling will adapt somewhat in CSS if we used fill="currentColor", but since it's an img we hardcode -->
  <!-- We'll use currentColor so that it can adapt if inline, but since it's an SVG file, we will use a generic color -->
  <text x="45" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#7C5CFF" letter-spacing="2">BOOMI</text>
